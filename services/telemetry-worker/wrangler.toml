name = "lila-telemetry"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

# Credits: nightly GitHub Sponsors poll, link checks and republish.
[triggers]
crons = ["0 15 * * *"]

# Credits stay off (503) until this is uncommented: `wrangler d1 create lila-credits`, paste its id,
# `wrangler d1 execute lila-credits --remote --file=schema.sql`, then deploy.
# [[d1_databases]]
# binding = "CREDITS_DB"
# database_name = "lila-credits"
# database_id = ""

# Issue reports. Secrets: REPORTS_APP_ID, REPORTS_APP_KEY, REPORTS_INSTALLATION_ID, ADMIN_TOKEN.
# The bucket's lifecycle rules expire files/ after 90 days and limits/ after 2.
[[r2_buckets]]
binding = "REPORTS"
bucket_name = "lila-reports"

[[ratelimits]]
name = "REPORT_LIMIT"
namespace_id = "1001"
simple = { limit = 3, period = 60 }
